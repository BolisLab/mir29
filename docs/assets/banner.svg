  <text x="76" y="200" font-family="Georgia,Palatino,serif" font-size="72" letter-spacing="-2" fill="#20342c">miR-29 trades youthful</text>
  <text x="76" y="287" font-family="Georgia,Palatino,serif" font-size="72" letter-spacing="-2" fill="#20342c">plasticity for</text>
  <text x="76" y="374" font-family="Georgia,Palatino,serif" font-size="72" letter-spacing="-2" fill="#795273">epigenetic fidelity</text>
  <text x="80" y="438" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5b6c60">Methods, code and evidence. Figure by figure.</text>
