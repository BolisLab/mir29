<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">miR-29 trades youthful plasticity for epigenetic fidelity</title>
  <desc id="desc">Bolis Lab research companion. Five chapters connect ageing, rejuvenation, evolution, epigenetic remodelling and cancer. Editorial banner in forest green, muted plum and warm white.</desc>
  <rect width="1440" height="600" fill="#f7f7f1"/>
