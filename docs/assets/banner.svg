  <text x="710" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="1.5" fill="#52665a">REMODELLING</text>
  <text x="970" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="1.5" fill="#52665a">CANCER</text>
